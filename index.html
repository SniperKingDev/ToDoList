<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Une To Do List simple et efficace pour organiser tes tâches, suivre ton avancement et rester concentré sur ce qui compte vraiment.">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TO DO list</title>
  <!--premier site sur github le 08/11/2026 -->
</head>
<body>
  <div class="container">

    <h1>My Tasks</h1>
    <p class="subtitle">Organise ta journée, une tâche à la fois.</p>
    <p class="description">Une To Do List simple et efficace pour noter tes tâches, suivre ton avancement et rester concentré sur ce qui compte vraiment.</p>

    <div class="task-form">
        <input id="tacheInput" placeholder="Ajouter une tâche...">

        <button id="Ajouter" onclick="Ajouter()">+</button>
    </div>

    <ul id="Taches"></ul>

</div>
</body>

<script src="script.js"></script>
